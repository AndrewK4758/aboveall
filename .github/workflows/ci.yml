name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linting
        run: pnpm nx run-many -t lint

      - name: Run Type Checking
        run: pnpm nx run-many -t typecheck

      - name: Run Unit Tests
        run: pnpm nx run-many -t test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        run: pnpm exec playwright test --config=apps/website/website-e2e/playwright.config.ts --project=chromium

      - name: Build Application
        run: pnpm nx run @aboveall/website:build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: apps/website/website/dist
          retention-days: 1

  deploy:
    name: Deploy to Google App Engine
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: apps/website/website/dist

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Google App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v2
        with:
          working_directory: apps/website/website
          deliverables: app.yaml
          promote: true

      - name: Verify Live Deployment
        run: |
          echo "Deployed successfully to: ${{ steps.deploy.outputs.version_url }}"
          curl -f -I "${{ steps.deploy.outputs.version_url }}"
