<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Turbine Ring Gradient -->
    <linearGradient id="turbineRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="25%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Deep Navy Left Leg Gradient -->
    <linearGradient id="navyLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B457D"/>
      <stop offset="50%" stop-color="#0E2D54"/>
      <stop offset="100%" stop-color="#07182E"/>
    </linearGradient>

    <!-- Royal to Cyan Rising Arrow Gradient -->
    <linearGradient id="arrowGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E2D54"/>
      <stop offset="35%" stop-color="#0066CC"/>
      <stop offset="70%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#38B6FF"/>
    </linearGradient>

    <!-- Warm Orange Peak Gradient -->
    <linearGradient id="orangePeak" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>

    <!-- Cool Air Swoosh (Cyan to Deep Blue) -->
    <linearGradient id="coolSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38B6FF"/>
      <stop offset="60%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#0E2D54"/>
    </linearGradient>

    <!-- Warm Heat Swoosh (Orange) -->
    <linearGradient id="warmSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB03A"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Mechanical Gear Steel Gradient -->
    <linearGradient id="gearSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#07182E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#emblemShadow)">
    <!-- 1. Outer Turbine Stator Ring -->
    <circle cx="200" cy="200" r="170" fill="none" stroke="url(#turbineRing)" stroke-width="26"/>
    <circle cx="200" cy="200" r="183" fill="none" stroke="#64748B" stroke-width="2"/>
    <circle cx="200" cy="200" r="157" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- 2. Radial Turbine Blades (Curved HVAC Aerodynamics) -->
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M 200,43 C 215,70 215,110 200,140"/>
      <path d="M 278,75 C 280,105 260,135 240,160"/>
      <path d="M 335,132 C 325,160 295,180 265,190"/>
      <path d="M 357,200 C 330,215 290,215 260,200"/>
      <path d="M 335,268 C 305,270 275,250 250,230"/>
      <path d="M 278,325 C 250,315 230,285 220,255"/>
      <path d="M 200,357 C 185,330 185,290 200,260"/>
      <path d="M 122,325 C 120,295 140,265 160,240"/>
      <path d="M 65,268 C 75,240 105,220 135,210"/>
      <path d="M 43,200 C 70,185 110,185 140,200"/>
      <path d="M 65,132 C 95,130 125,150 150,170"/>
      <path d="M 122,75 C 150,85 170,115 180,145"/>
    </g>

    <!-- 3. Warm Heat Airflow Swirl (Background / Right Side) -->
    <path d="M 220,185 C 270,140 330,145 350,185 C 365,220 330,260 255,270"
          fill="none" stroke="url(#warmSwoosh)" stroke-width="15" stroke-linecap="round"/>

    <!-- 4. The Iconic Stylized "A" -->

    <!-- 4a. Left Leg (Deep Blue, Bold Structural Foot) -->
    <path d="M 152,244 L 180,118 L 202,118 L 182,244 Z" fill="url(#navyLeg)"/>
    <path d="M 132,244 L 160,244 L 195,110 L 175,100 Z" fill="#0E2D54"/>

    <!-- 4b. Inner Flame / Heat Wedge (Orange) -->
    <polygon points="194,102 216,168 196,168" fill="url(#orangePeak)"/>

    <!-- 4c. Mechanical Gear Teeth / Wrench Profile (Bottom Right Leg) -->
    <g fill="url(#gearSteel)" stroke="#475569" stroke-width="1.5">
      <path d="M 218,210 L 236,242 L 230,246 L 236,254 L 244,250 L 250,260 L 240,266 L 246,274 L 230,284 L 210,248 Z"/>
      <!-- Internal gear notch -->
      <circle cx="230" cy="254" r="4" fill="#1E293B"/>
    </g>

    <!-- 4d. Right Leg Morphing into the Soaring Arrow (Royal Blue / Cyan) -->
    <path d="M 194,98 L 242,190 L 222,198 L 182,108 Z" fill="#0077C8"/>
    <!-- The Upward Arrowhead Shooting Past Apex -->
    <path d="M 204,124 L 238,62 L 260,114 L 244,110 L 246,128 L 228,124 L 226,108 Z"
          fill="url(#arrowGradient)" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- 5. Cool Air Velocity Swoosh (Front Crescent Swirl) -->
    <!-- Front Dynamic Ribbon Wrapping Across the "A" from Left to Center-Right -->
    <path d="M 75,210 C 85,160 140,150 178,190 C 205,218 240,210 260,180"
          fill="none" stroke="url(#coolSwoosh)" stroke-width="18" stroke-linecap="round"/>
    <!-- Highlight sheen on cool swoosh -->
    <path d="M 85,206 C 98,168 142,160 175,192 C 198,214 232,208 252,182"
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Hub Core Pin -->
    <circle cx="200" cy="200" r="14" fill="#0E2D54" stroke="#38B6FF" stroke-width="2.5"/>
    <circle cx="200" cy="200" r="6" fill="#F8FAFC"/>
  </g>
</svg>
