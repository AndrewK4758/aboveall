<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182E"/>
      <stop offset="50%" stop-color="#0E2D54"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#commGrad)"/>

  <!-- Commercial Building Silhouette -->
  <g opacity="0.3" fill="#0B1B2B" stroke="#475569" stroke-width="1.5">
    <rect x="100" y="160" width="140" height="340"/>
    <rect x="260" y="80" width="220" height="420"/>
    <rect x="500" y="130" width="180" height="370"/>
    <!-- Windows -->
    <g fill="#38B6FF" opacity="0.4">
      <rect x="280" y="120" width="20" height="15"/>
      <rect x="320" y="120" width="20" height="15"/>
      <rect x="360" y="120" width="20" height="15"/>
      <rect x="400" y="120" width="20" height="15"/>
      <rect x="440" y="120" width="20" height="15"/>
      <rect x="280" y="160" width="20" height="15"/>
      <rect x="320" y="160" width="20" height="15"/>
      <rect x="360" y="160" width="20" height="15"/>
      <rect x="400" y="160" width="20" height="15"/>
      <rect x="440" y="160" width="20" height="15"/>
    </g>
  </g>

  <!-- Rooftop Packaged Unit (RTU) & Spiral Ducting -->
  <g transform="translate(230, 230)">
    <!-- Base Curb -->
    <rect x="30" y="180" width="360" height="24" rx="4" fill="#334155"/>
    <!-- Main RTU Enclosure -->
    <rect x="40" y="40" width="340" height="140" rx="8" fill="url(#metalGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="60" y="60" width="130" height="100" rx="6" fill="#1E293B"/>
    <rect x="210" y="60" width="150" height="100" rx="6" fill="#1E293B"/>

    <!-- Exhaust & Intake Fans -->
    <circle cx="125" cy="110" r="38" fill="#0F172A" stroke="#FF7A00" stroke-width="2.5"/>
    <circle cx="285" cy="110" r="38" fill="#0F172A" stroke="#00A3E0" stroke-width="2.5"/>
    <path d="M125,72 L125,148 M87,110 L163,110" stroke="#FF7A00" stroke-width="3"/>
    <path d="M285,72 L285,148 M247,110 L323,110" stroke="#00A3E0" stroke-width="3"/>

    <!-- Heavy Commercial Spiral Air Ducts -->
    <path d="M380,80 C440,80 480,120 520,120 L550,120" fill="none" stroke="#94A3B8" stroke-width="28" stroke-linecap="round"/>
    <path d="M380,80 C440,80 480,120 520,120 L550,120" fill="none" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/>
  </g>

  <!-- Flow Lines -->
  <path d="M60,420 C220,380 340,320 520,290 C620,270 700,240 760,180" fill="none" stroke="#FF7A00" stroke-width="6" opacity="0.75" stroke-dasharray="8 6"/>

  <!-- Badge -->
  <g transform="translate(60, 60)">
    <rect width="280" height="74" rx="14" fill="#0E2D54" fill-opacity="0.95" stroke="#FF7A00" stroke-width="1.5"/>
    <text x="24" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">COMMERCIAL HVAC</text>
    <text x="24" y="55" fill="#FFB03A" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Rooftops, VRF, Chillers &amp; Controls</text>
  </g>
</svg>
