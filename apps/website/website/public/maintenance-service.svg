<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="maintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2D54"/>
      <stop offset="70%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#07182E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#maintGrad)"/>

  <!-- High Precision HVAC Diagnostic Gauges -->
  <g transform="translate(420, 160)">
    <!-- Manifold Gauge Block -->
    <rect x="50" y="140" width="180" height="60" rx="8" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
    <rect x="70" y="150" width="40" height="40" rx="20" fill="#0080FF"/>
    <rect x="170" y="150" width="40" height="40" rx="20" fill="#EA580C"/>

    <!-- Left Gauge (Low Side / Blue) -->
    <circle cx="90" cy="70" r="58" fill="#0F172A" stroke="#0080FF" stroke-width="6"/>
    <circle cx="90" cy="70" r="48" fill="#1E293B"/>
    <path d="M60,85 A40,40 0 1,1 120,85" fill="none" stroke="#38B6FF" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="90" y1="70" x2="115" y2="50" stroke="#38B6FF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="90" cy="70" r="8" fill="#FFFFFF"/>
    <text x="90" y="100" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">LOW PSI</text>

    <!-- Right Gauge (High Side / Red-Orange) -->
    <circle cx="190" cy="70" r="58" fill="#0F172A" stroke="#EA580C" stroke-width="6"/>
    <circle cx="190" cy="70" r="48" fill="#1E293B"/>
    <path d="M160,85 A40,40 0 1,1 220,85" fill="none" stroke="#FF7A00" stroke-width="4" stroke-dasharray="6 4"/>
    <line x1="190" y1="70" x2="175" y2="40" stroke="#FF7A00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="190" cy="70" r="8" fill="#FFFFFF"/>
    <text x="190" y="100" fill="#94A3B8" font-size="10" font-weight="700" text-anchor="middle" font-family="sans-serif">HIGH PSI</text>

    <!-- Hoses -->
    <path d="M90,200 C80,260 50,300 30,340" fill="none" stroke="#0080FF" stroke-width="8" stroke-linecap="round"/>
    <path d="M140,200 C140,260 140,300 140,340" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
    <path d="M190,200 C200,260 230,300 250,340" fill="none" stroke="#EA580C" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Inspection Checklist Graphic -->
  <g transform="translate(100, 200)">
    <rect width="240" height="220" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="24" y="24" width="30" height="30" rx="6" fill="#00A3E0"/>
    <path d="M30,38 L37,45 L48,32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="39" x2="210" y2="39" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <rect x="24" y="74" width="30" height="30" rx="6" fill="#00A3E0"/>
    <path d="M30,88 L37,95 L48,82" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="89" x2="190" y2="89" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <rect x="24" y="124" width="30" height="30" rx="6" fill="#00A3E0"/>
    <path d="M30,138 L37,145 L48,132" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="139" x2="200" y2="139" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>

    <rect x="24" y="174" width="30" height="30" rx="6" fill="#FF7A00"/>
    <path d="M30,188 L37,195 L48,182" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="70" y1="189" x2="170" y2="189" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Badge -->
  <g transform="translate(60, 60)">
    <rect width="290" height="74" rx="14" fill="#0E2D54" fill-opacity="0.95" stroke="#10B981" stroke-width="1.5"/>
    <text x="24" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">PREVENTATIVE CARE</text>
    <text x="24" y="55" fill="#34D399" font-family="system-ui, sans-serif" font-size="13" font-weight="500">21-Point Precision Tune-Ups</text>
  </g>
</svg>
