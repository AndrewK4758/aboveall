<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2D54"/>
      <stop offset="50%" stop-color="#1B3B6F"/>
      <stop offset="100%" stop-color="#07182E"/>
    </linearGradient>
    <linearGradient id="coolFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38B6FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="warmFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB03A" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Architectural House Silhouette -->
  <g opacity="0.25" stroke="#FFFFFF" stroke-width="2" fill="none">
    <polygon points="400,90 220,230 250,230 250,420 550,420 550,230 580,230" />
    <line x1="330" y1="420" x2="330" y2="300"/>
    <line x1="470" y1="420" x2="470" y2="300"/>
    <line x1="330" y1="300" x2="470" y2="300"/>
  </g>

  <!-- High-Efficiency Outdoor Inverter AC Unit -->
  <g transform="translate(460, 240)">
    <!-- Unit Body -->
    <rect x="0" y="0" width="220" height="180" rx="16" fill="#1E293B" stroke="#94A3B8" stroke-width="3"/>
    <rect x="15" y="15" width="190" height="150" rx="10" fill="#0F172A"/>

    <!-- Protective Fan Grille -->
    <circle cx="110" cy="90" r="60" stroke="#64748B" stroke-width="3" fill="#1E293B"/>
    <circle cx="110" cy="90" r="42" stroke="#475569" stroke-width="2" fill="none"/>
    <circle cx="110" cy="90" r="24" stroke="#475569" stroke-width="2" fill="none"/>

    <!-- Fan Blades (Air Movement) -->
    <g transform="rotate(25, 110, 90)">
      <path d="M110,90 C120,60 145,55 150,70 C145,85 125,90 110,90 Z" fill="#00A3E0"/>
      <path d="M110,90 C140,100 145,125 130,130 C115,125 110,105 110,90 Z" fill="#00A3E0"/>
      <path d="M110,90 C100,120 75,125 70,110 C75,95 95,90 110,90 Z" fill="#00A3E0"/>
      <path d="M110,90 C80,80 75,55 90,50 C105,55 110,75 110,90 Z" fill="#00A3E0"/>
      <circle cx="110" cy="90" r="12" fill="#E2E8F0"/>
    </g>

    <!-- Digital Inverter Status Light -->
    <circle cx="35" cy="35" r="5" fill="#10B981" filter="url(#glow)"/>
    <text x="50" y="39" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">INVERTER PLUS</text>
  </g>

  <!-- Cool Air Dynamics Swirl (Blue) -->
  <path d="M120,380 C240,320 280,180 470,220 C540,235 600,190 680,150" fill="none" stroke="url(#coolFlow)" stroke-width="18" stroke-linecap="round"/>
  <path d="M140,410 C260,350 300,210 490,250 C560,265 620,220 700,180" fill="none" stroke="#38B6FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Warm Air Circulation (Orange) -->
  <path d="M160,260 C260,190 380,240 500,160 C580,110 650,130 720,100" fill="none" stroke="url(#warmFlow)" stroke-width="12" stroke-linecap="round"/>

  <!-- Residential Comfort Badge -->
  <g transform="translate(60, 60)">
    <rect width="260" height="74" rx="14" fill="#0E2D54" fill-opacity="0.9" stroke="#00A3E0" stroke-width="1.5"/>
    <text x="24" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">RESIDENTIAL HVAC</text>
    <text x="24" y="55" fill="#38B6FF" font-family="system-ui, sans-serif" font-size="13" font-weight="500">High-SEER2 Heat Pumps &amp; AC</text>
  </g>
</svg>
